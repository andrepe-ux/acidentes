<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Gestão Acidentes Trabalho</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { background: linear-gradient(135deg,#1f2937,#111827); }
input:disabled { opacity:.5; cursor:not-allowed; }
th { cursor:pointer; }
</style>
</head>

<body class="p-6 text-white">
<div class="max-w-7xl mx-auto relative">

<!-- TIMESTAMP -->
<div id="fileInfo"
 class="absolute top-0 right-40 bg-gray-800 px-4 py-2 rounded-xl text-sm font-semibold shadow">
Última gravação: —
</div>

<div id="unsavedTop"
 class="hidden absolute top-0 right-0 bg-red-600 px-6 py-3 text-xl font-extrabold rounded-xl shadow">
FICHEIRO NÃO GUARDADO
</div>

<h1 class="text-3xl font-bold mb-6">Gestão Acidentes Trabalho</h1>

<div id="status" class="mb-4 p-4 rounded-xl bg-red-100 text-red-700 font-semibold">
⚠️ Abra um ficheiro JSON para começar
</div>

<div class="flex gap-2 mb-6">
<button id="tabMain" onclick="showTab('main')"
 class="bg-blue-600 px-4 py-2 rounded-xl font-semibold">Registos</button>
<button id="tabCharts" onclick="showTab('charts')"
 class="bg-gray-600 px-4 py-2 rounded-xl font-semibold">Gráficos</button>
</div>

<div class="flex gap-2 mb-6 flex-wrap">
<button id="saveBtn" onclick="exportJSON()" disabled
 class="bg-gray-400 px-4 py-2 rounded-xl cursor-not-allowed">
Guardar Ficheiro
</button>

<button id="excelBtn" onclick="exportExcel()" disabled
 class="bg-emerald-600 px-4 py-2 rounded-xl hover:bg-emerald-700">
Exportar Excel
</button>

<label class="bg-blue-600 px-4 py-2 rounded-xl cursor-pointer hover:bg-blue-700">
Abrir Ficheiro
<input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
</label>

<input id="searchMatricula" placeholder="Pesquisar Matrícula"
 class="border p-2 rounded text-black" oninput="render(this.value)">
</div>

<!-- ================= MAIN TAB ================= -->

<div id="mainTab">

<div id="formBlock"
 class="bg-white text-black p-6 rounded-2xl shadow mb-6 opacity-50 pointer-events-none">
<div class="grid grid-cols-1 md:grid-cols-8 gap-4">
<input id="matricula" placeholder="Matrícula" class="border p-2 rounded">
<input id="nome" placeholder="Nome" class="border p-2 rounded">
<input id="centro" placeholder="Centro" class="border p-2 rounded">
<input id="inicio" type="date" class="border p-2 rounded">
<input id="fim" type="date" class="border p-2 rounded">
<input id="obs" placeholder="Observações" class="border p-2 rounded">

<label class="flex items-center gap-2">
<input type="checkbox" id="comunicado"> Comunicado SS
</label>
<label class="flex items-center gap-2">
<input type="checkbox" id="concluido"> Concluído
</label>
</div>

<button onclick="addWorker()"
 class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700">
Adicionar
</button>
</div>

<div id="tableBlock"
 class="bg-white text-black rounded-2xl shadow overflow-x-auto opacity-50 pointer-events-none">
<table class="w-full text-sm">
<thead class="bg-gray-200">
<tr>
<th onclick="sortBy('id')">ID</th>
<th onclick="sortBy('matricula')">Matrícula</th>
<th onclick="sortBy('nome')">Nome</th>
<th onclick="sortBy('centro')">Centro</th>
<th onclick="sortBy('inicio')">Início</th>
<th onclick="sortBy('fim')">Fim</th>
<th onclick="sortBy('dias')">Dias</th>
<th>Obs</th>
<th>SS</th>
<th>Concl.</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div id="unsavedBottom"
 class="hidden mt-6 bg-red-600 px-6 py-3 text-xl font-extrabold rounded-xl text-center">
FICHEIRO NÃO GUARDADO
</div>
</div>

<!-- ================= GRÁFICOS ================= -->

<div id="chartsTab" class="hidden">
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">

<div class="bg-white text-black p-4 rounded-xl">
<h2 class="font-bold mb-2">Acidentes por Mês</h2>
<canvas id="chartMonth"></canvas>
</div>

<div class="bg-white text-black p-4 rounded-xl">
<h2 class="font-bold mb-2">Acidentes por Intervalo de Dias</h2>
<canvas id="chartRange"></canvas>
</div>

<div class="bg-white text-black p-4 rounded-xl md:col-span-2">
<h2 class="font-bold mb-2">Acidentes por Centro</h2>
<canvas id="chartCenter" height="140"></canvas>
</div>

</div>
</div>

<footer class="mt-6 text-center text-gray-400 font-semibold">
andrepe @ <span id="year"></span>
</footer>

</div>

<script>
document.getElementById('year').innerText = new Date().getFullYear();
Chart.register(ChartDataLabels);

let workers=[], nextId=1, editId=null;
let chartMonth=null, chartRange=null, chartCenter=null;
let currentSort={key:'id',asc:true};

const diffDays=(s,e)=>{
 const a=new Date(s), b=e?new Date(e):new Date();
 return Math.max(1,Math.ceil((b-a)/86400000));
};

const formatTS=d=>d.toISOString().slice(0,19).replace('T',' ');

/* ========= ESTADO ========= */
function markUnsaved(){ unsavedTop.classList.remove('hidden'); unsavedBottom.classList.remove('hidden'); }
function clearUnsaved(){ unsavedTop.classList.add('hidden'); unsavedBottom.classList.add('hidden'); }

function enableApp(){
 ['formBlock','tableBlock'].forEach(id=>{
  document.getElementById(id).classList.remove('opacity-50','pointer-events-none');
 });
 saveBtn.disabled=false;
 excelBtn.disabled=false;
 saveBtn.className='bg-green-600 px-4 py-2 rounded-xl hover:bg-green-700';
}

/* ========= TABS ========= */
function showTab(tab){
 mainTab.classList.toggle('hidden',tab!=='main');
 chartsTab.classList.toggle('hidden',tab!=='charts');
 if(tab==='charts') updateCharts();
}

/* ========= TABELA ========= */
function render(filter=''){
 tableBody.innerHTML='';
 let list=[...workers].map(w=>({...w,dias:diffDays(w.inicio,w.fim)}));

 if(filter) list=list.filter(w=>w.matricula.toLowerCase().includes(filter.toLowerCase()));

 list.sort((a,b)=>{
  let A=a[currentSort.key], B=b[currentSort.key];
  if(currentSort.key==='dias'){A=a.dias;B=b.dias;}
  if(currentSort.key==='inicio'||currentSort.key==='fim'){A=A||'';B=B||'';}
  if(A<B) return currentSort.asc?-1:1;
  if(A>B) return currentSort.asc?1:-1;
  return 0;
 });

 list.forEach(w=>{
  const d=w.dias;
  const e=editId===w.id;
  const dis=e?'':'disabled';

  const badge=!w.concluido && d>29 
    ? `<span class="px-2 py-1 bg-yellow-300 rounded font-bold">${d}</span>` 
    : `<span class="font-bold">${d}</span>`;

  tableBody.innerHTML+=`
<tr class="border-t ${w.concluido?'bg-gray-200 text-gray-500':''}" data-id="${w.id}">
<td>${w.id}</td>
<td><input ${dis} value="${w.matricula}" class="border p-1 w-full"></td>
<td><input ${dis} value="${w.nome}" class="border p-1 w-full"></td>
<td><input ${dis} value="${w.centro}" class="border p-1 w-full"></td>
<td><input ${dis} type="date" value="${w.inicio}" class="border p-1"></td>
<td><input ${dis} type="date" value="${w.fim||''}" class="border p-1"></td>
<td class="text-center">${badge}</td>
<td><input ${dis} value="${w.obs||''}" class="border p-1 w-full"></td>
<td class="text-center"><input ${dis} type="checkbox" ${w.comunicado?'checked':''}></td>
<td class="text-center"><input ${dis} type="checkbox" ${w.concluido?'checked':''}></td>
<td class="text-center space-x-1">
<button onclick="toggleEdit('${w.id}')"
 class="px-2 py-1 rounded ${e?'bg-green-600':'bg-blue-600'} text-white">
${e?'Guardar':'Editar'}
</button>
${e?`<button onclick="deleteWorker('${w.id}')" class="px-2 py-1 bg-red-600 text-white rounded">Eliminar</button>`:''}
</td>
</tr>`;
 });
}

function addWorker(){
 if(!matricula.value||!nome.value||!inicio.value){ alert('Campos obrigatórios em falta'); return; }
 workers.push({
  id:String(nextId++).padStart(7,'0'),
  matricula:matricula.value,
  nome:nome.value,
  centro:centro.value,
  inicio:inicio.value,
  fim:fim.value,
  obs:obs.value,
  comunicado:comunicado.checked,
  concluido:concluido.checked
 });
 render(searchMatricula.value);
 markUnsaved();
 matricula.value=nome.value=centro.value=inicio.value=fim.value=obs.value='';
 comunicado.checked=concluido.checked=false;
}

function toggleEdit(id){
 if(editId===id){
  const row=document.querySelector(`tr[data-id="${id}"]`);
  const r=row.querySelectorAll('input');
  const i=workers.findIndex(w=>w.id===id);
  workers[i]={...workers[i],
   matricula:r[0].value,
   nome:r[1].value,
   centro:r[2].value,
   inicio:r[3].value,
   fim:r[4].value,
   obs:r[5].value,
   comunicado:r[6].checked,
   concluido:r[7].checked
  };
  editId=null;
  markUnsaved();
 } else editId=id;
 render(searchMatricula.value);
}

function deleteWorker(id){
 if(confirm('Eliminar registo?')){
  workers=workers.filter(w=>w.id!==id);
  editId=null;
  render(searchMatricula.value);
  markUnsaved();
 }
}

function sortBy(key){
 if(currentSort.key===key) currentSort.asc=!currentSort.asc;
 else currentSort={key:key,asc:true};
 render(searchMatricula.value);
}

/* ========= EXPORT / IMPORT ========= */
function exportJSON(){
 const lastSaved=formatTS(new Date());
 const blob=new Blob([JSON.stringify({lastSaved,nextId,workers},null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='acidentes.json';
 a.click();
 fileInfo.innerText='Última gravação: '+lastSaved;
 clearUnsaved();
}

function importJSON(e){
 const r=new FileReader();
 r.onload=ev=>{
  const p=JSON.parse(ev.target.result);
  workers=p.workers||[];
  nextId=p.nextId||1;
  fileInfo.innerText='Última gravação: '+(p.lastSaved||'—');
  enableApp();
  status.innerText='✔️ Ficheiro carregado';
  status.className='mb-4 p-4 rounded-xl bg-green-100 text-green-700 font-semibold';
  render(searchMatricula.value);
  clearUnsaved();
 };
 r.readAsText(e.target.files[0]);
}

function exportExcel(){
 const ws=XLSX.utils.json_to_sheet(workers);
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Acidentes');
 XLSX.writeFile(wb,'acidentes.xlsx');
}

/* ========= GRÁFICOS ========= */
function updateCharts(){
 const months={}, ranges={'1-15':0,'16-30':0,'31-60':0,'61-120':0,'+121':0}, centers={};

 workers.forEach(w=>{
  const m=w.inicio.slice(0,7);
  months[m]=(months[m]||0)+1;

  const d=diffDays(w.inicio,w.fim);
  if(d<=15) ranges['1-15']++;
  else if(d<=30) ranges['16-30']++;
  else if(d<=60) ranges['31-60']++;
  else if(d<=120) ranges['61-120']++;
  else ranges['+121']++;

  centers[w.centro||'Sem Centro']=(centers[w.centro||'Sem Centro']||0)+1;
 });

 chartMonth?.destroy();
 chartRange?.destroy();
 chartCenter?.destroy();

 chartMonth=new Chart(document.getElementById('chartMonth').getContext('2d'),{
  type:'bar',
  data:{labels:Object.keys(months),datasets:[{data:Object.values(months),backgroundColor:'#3b82f6'}]},
  options:chartOptions()
 });

 chartRange=new Chart(document.getElementById('chartRange').getContext('2d'),{
  type:'bar',
  data:{labels:Object.keys(ranges),datasets:[{data:Object.values(ranges),backgroundColor:'#10b981'}]},
  options:chartOptions()
 });

 chartCenter=new Chart(document.getElementById('chartCenter').getContext('2d'),{
  type:'bar',
  data:{labels:Object.keys(centers),datasets:[{data:Object.values(centers),backgroundColor:'#f59e0b'}]},
  options:chartOptions()
 });
}

function chartOptions(){
 return {
  responsive:true,
  plugins:{
   legend:{display:false},
   datalabels:{color:'#000',font:{weight:'bold'}}
  },
  scales:{y:{beginAtZero:true}}
 };
}
</script>
</body>
</html>
